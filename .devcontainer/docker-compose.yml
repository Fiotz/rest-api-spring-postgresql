# .devcontainer/docker-compose.yml
version: '3.8'
services:
  app:
    image: mcr.microsoft.com/devcontainers/java:17 # Imagem base com Java
    volumes:
      - ..:/workspaces:cached # Monta o código do projeto
    command: sleep infinity # Mantém o container ativo
    depends_on:
      db:
        condition: service_healthy # Aguarda o banco estar pronto
    environment:
      # Variáveis de ambiente para conexão com o banco
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/meubanco
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data # Persiste os dados
    environment:
      POSTGRES_DB: meubanco
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meubanco"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres-data: