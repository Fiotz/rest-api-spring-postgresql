<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Produtos</title>
    <link rel="stylesheet" href="https://unpkg.com/sakura.css/css/sakura.css" type="text/css">
</head>
<body>
    <nav>
        <a href="/" class="nav-link">Início</a>
        <!-- Note que o link agora aponta para /produtos -->
        <a href="/produtos" class="nav-link">Produtos</a>
    </nav>

    <main id="app-container">
        <!-- O conteúdo será injetado aqui -->
    </main>

    <!-- Template: Home -->
    <template id="tpl-home">
        <h1>Sistema de Estoque</h1>
        <p>Bem-vindo. Acesse o menu acima para gerenciar os produtos.</p>
    </template>

    <!-- Template: Produtos -->
    <template id="tpl-produtos">
        <h1>Gerenciamento de Produtos</h1>
        
        <table id="tabelaFormulario" style="display:none;">    
            <tr> <td>ID:</td> <td><input type="text" id="txtId" disabled></td> </tr>
            <tr> <td>Nome:</td> <td><input type="text" id="txtNome"></td> </tr>
            <tr> <td>Preço:</td> <td><input type="number" step="0.01" id="txtPreco"></td> </tr> 
            <tr><td></td><td>
                <input type="button" value="Salvar" onclick="salvarProduto()" id="btnSalvar">
                <input type="button" value="Apagar" onclick="apagarProduto()" id="btnApagar">
                <input type="button" value="Cancelar" onclick="cancelarEdicao()" id="btnCancelar">
            </td></tr>
        </table> 
        
        <p style="font-weight:bold" id="paragrafoMensagem"></p>
        
        <table id="tabelaProdutos">  
            <tr><td><input type="button" value="Novo" onclick="novoProduto()" id="btnNovo"></td> <td></td> <td></td></tr>
            <tr> <th>ID</th> <th>Nome</th> <th>Preço</th> </tr>
            <tbody id="corpoTabelaProdutos"> </tbody>
        </table>
    </template>

    <script src="rest.js"></script>
    <script src="app.js"></script>
</body>
</html>
